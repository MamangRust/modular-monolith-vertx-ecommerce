name: CI & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Serialize runs per branch so the update-manifests job never races another run
# on `git push` (non-fast-forward rejection). A newer push simply waits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner && github.repository_owner || 'vertx-ecommerce' }}
  # Derive a unique image tag per commit to enable rollback
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify GHCR_OWNER matches repository owner
        # The k8s manifests pull images from ghcr.io/<owner>/vertx-ecommerce/<svc>,
        # where <owner> comes from the GHCR_OWNER key in app-config (templated via
        # kustomize replacements). Fail the build when it drifts from the actual
        # github.repository_owner so CI pushes and cluster pulls always agree.
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CM_OWNER=$(sed -n 's/.*GHCR_OWNER: "\([^"]*\)".*/\1/p' deployments/kubernetes/base/common/configsmaps.yaml)
          if [ -z "$CM_OWNER" ]; then
            echo "::error::GHCR_OWNER not found in deployments/kubernetes/base/common/configsmaps.yaml"
            exit 1
          fi
          if [ "$CM_OWNER" != "$OWNER_LOWER" ]; then
            echo "::error::GHCR_OWNER ($CM_OWNER) != github.repository_owner ($OWNER_LOWER). Update deployments/kubernetes/base/common/configsmaps.yaml so cluster pulls match CI pushes."
            exit 1
          fi
          echo "GHCR_OWNER ($CM_OWNER) matches repository owner"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile, Test & Verify
        run: mvn -B clean verify -Dsurefire.failIfNoSpecifiedTests=false

      - name: Detect Dead Dependencies
        # dependency:analyze fails on UNUSED-DECLARED (dead) and
        # USED-UNDECLARED dependencies. The audited baseline of benign findings
        # (runtime/SPI usage, annotation processors, parent-inherited test deps)
        # is whitelisted in the root pom.xml (maven-dependency-plugin). Any NEW
        # warning fails the build, so dead dependencies are caught automatically.
        run: mvn -B dependency:analyze -DfailOnWarning=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 14

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  security-scan:
    name: DevSecOps Security Auditing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan (Vulnerabilities & Secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Run Trivy Config Scan (IaC Misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  build-docker:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        service:
          - apigateway
          - auth
          - role
          - user
          - email
          - banner
          - cart
          - category
          - merchant
          - merchant_award
          - merchant_business
          - merchant_detail
          - merchant_policy
          - order
          - order_item
          - product
          - review
          - review_detail
          - shipping_address
          - slider
          - transaction
          - db-migration

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            --progress=plain \
            -f ${{ matrix.service }}/Dockerfile \
            -t ${{ matrix.service }}:${IMAGE_TAG} \
            -t ${{ matrix.service }}:latest \
            .

      - name: Scan Built Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ matrix.service }}:${IMAGE_TAG}'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Push to GHCR (tagged + latest)
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')
          REMOTE="${IMAGE_REGISTRY}/${OWNER}/vertx-ecommerce"

          docker tag ${{ matrix.service }}:${IMAGE_TAG}   ${REMOTE}/${{ matrix.service }}:${IMAGE_TAG}
          docker tag ${{ matrix.service }}:latest          ${REMOTE}/${{ matrix.service }}:latest

          docker push ${REMOTE}/${{ matrix.service }}:${IMAGE_TAG}
          docker push ${REMOTE}/${{ matrix.service }}:latest

  # Keeps the GitOps manifests in sync with the images actually pushed to GHCR:
  # after every push build, pin every `newTag` in the production overlay to the
  # commit SHA (${IMAGE_TAG}) so ArgoCD always rolls out the exact artifacts
  # this pipeline produced. The commit is made with GITHUB_TOKEN (which GitHub
  # does not re-trigger workflows with) and tagged [skip ci] as a second guard.
  # Assumes direct push to the protected branch is allowed for GITHUB_TOKEN
  # (i.e. no branch protection ruleset that requires PRs on main).
  update-manifests:
    name: Pin Production Overlay newTag
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pin newTag to pushed image SHA
        run: |
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" deployments/kubernetes/overlays/production/kustomization.yaml
          COUNT=$(grep -c "newTag: ${IMAGE_TAG}" deployments/kubernetes/overlays/production/kustomization.yaml)
          echo "Pinned ${COUNT} image(s) to ${IMAGE_TAG}"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No newTag entries updated in the production overlay"
            exit 1
          fi

      - name: Commit and push manifest update
        run: |
          FILE=deployments/kubernetes/overlays/production/kustomization.yaml
          if git diff --quiet "$FILE"; then
            echo "newTag already up to date — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "chore(deploy): pin production overlay newTag to ${IMAGE_TAG} [skip ci]"
            git push
            echo "Committed and pushed newTag=${IMAGE_TAG}"
          fi
